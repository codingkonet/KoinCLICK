plugins {
    id 'com.android.application'
}

android {
    namespace 'com.koinclick.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.koinclick.app"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "1.0.1"
    }

    signingConfigs {
        release {
            storeFile file("koinclick-release.jks")
            storePassword "koinclick123"
            keyAlias "koinclick"
            keyPassword "koinclick123"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
}
